<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tamir Akademisi</title>
  <meta name="description" content="Telefon ve tablet tamirini sıfırdan öğreten, marka bağımsız ücretsiz kurs.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171c23" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tamir Akademisi">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="ikonlar/logo.svg" type="image/svg+xml">
  <link rel="icon" href="ikonlar/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="ikonlar/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Tema, sayfa çizilmeden önce uygulanır (yanıp sönmeyi önler)
    (function () {
      try {
        var t = localStorage.getItem('ta-tema');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="ust">
    <a href="#/" class="logo" aria-label="Ana sayfa">
      <img src="ikonlar/logo.svg" width="34" height="34" alt="">
      <span>Tamir <b>Akademisi</b></span>
    </a>
    <nav class="ust-nav">
      <a href="#/" data-nav="ana" class="masaustu">Kurs</a>
      <a href="#/markalar" data-nav="markalar" class="masaustu">Markalar</a>
      <a href="#/yazilim" data-nav="yazilim" class="masaustu">Yazılım</a>
      <a href="#/araclar" data-nav="araclar" class="masaustu">Araçlar</a>
      <a href="#/sertifika" data-nav="sertifika" class="masaustu">Sertifika</a>
      <a href="#/hakkinda" data-nav="hakkinda">Hakkında</a>
      <button id="temaBtn" class="tema-btn" type="button" aria-label="Temayı değiştir" title="Açık / koyu tema">
        <svg class="ikon-gunes" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></g></svg>
        <svg class="ikon-ay" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="currentColor"/></svg>
      </button>
    </nav>
  </header>

  <main id="uygulama" tabindex="-1"></main>

  <footer class="alt">
    <p>Tamir Akademisi · Eğitim amaçlıdır. Cihazınızı açmak garantiyi bozabilir; tüm işlemler sizin sorumluluğunuzdadır.</p>
  </footer>

  <!-- Telefon için alt sekme çubuğu -->
  <nav class="alt-sekme" aria-label="Ana menü">
    <a href="#/" data-nav="ana"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Kurs</span></a>
    <a href="#/markalar" data-nav="markalar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg><span>Markalar</span></a>
    <a href="#/yazilim" data-nav="yazilim"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 9l-3 3 3 3M16 9l3 3-3 3M13.5 6l-3 12"/></svg><span>Yazılım</span></a>
    <a href="#/araclar" data-nav="araclar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg><span>Araçlar</span></a>
    <a href="#/sertifika" data-nav="sertifika"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 22l5-3 5 3-1.5-8"/></svg><span>Sertifika</span></a>
  </nav>

  <script src="js/veri/moduller.js"></script>
  <script src="js/veri/modul-temeller.js"></script>
  <script src="js/veri/modul-anatomi.js"></script>
  <script src="js/veri/modul-teshis.js"></script>
  <script src="js/veri/modul-sokum.js"></script>
  <script src="js/veri/modul-tamirler.js"></script>
  <script src="js/veri/modul-ileri.js"></script>
  <script src="js/veri/modul-yazilim.js"></script>
  <script src="js/veri/modul-meslek.js"></script>
  <script src="js/veri/canlandirmalar.js"></script>
  <script src="js/veri/sozluk.js"></script>
  <script src="js/veri/foto-kaynaklari.js"></script>
  <script src="js/veri/markalar.js"></script>
  <script src="js/veri/yazilim-alani.js"></script>
  <script src="js/bilesenler.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
