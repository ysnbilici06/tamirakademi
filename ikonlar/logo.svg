<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="z" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a84ff"/>
      <stop offset="1" stop-color="#5b3cc4"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#f2a900"/>
    </linearGradient>
    <mask id="anahtar">
      <rect width="512" height="512" fill="#000"/>
      <g transform="translate(352 352) rotate(-45)">
        <circle cx="0" cy="-58" r="54" fill="#fff"/>
        <rect x="-21" y="-30" width="42" height="170" rx="21" fill="#fff"/>
        <rect x="-17" y="-128" width="34" height="62" rx="6" fill="#000"/>
      </g>
    </mask>
    <mask id="anahtarKenar">
      <rect width="512" height="512" fill="#000"/>
      <g transform="translate(352 352) rotate(-45)">
        <circle cx="0" cy="-58" r="68" fill="#fff"/>
        <rect x="-35" y="-30" width="70" height="184" rx="35" fill="#fff"/>
        <rect x="-5" y="-140" width="10" height="60" fill="#000"/>
      </g>
    </mask>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#z)"/>
  <!-- telefon -->
  <rect x="150" y="80" width="188" height="320" rx="38" fill="rgba(255,255,255,.12)" stroke="#fff" stroke-width="22"/>
  <rect x="214" y="110" width="60" height="12" rx="6" fill="#fff"/>
  <!-- devre yolu -->
  <g fill="none" stroke="#ffd60a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M196 196 H244 V236 H292"/>
    <path d="M244 236 V292 H196"/>
  </g>
  <g fill="#ffd60a"><circle cx="196" cy="196" r="14"/><circle cx="292" cy="236" r="14"/><circle cx="196" cy="292" r="14"/></g>
  <!-- İngiliz anahtarı (koyu kenar + sarı gövde) -->
  <rect width="512" height="512" fill="#3a2a9a" mask="url(#anahtarKenar)"/>
  <rect width="512" height="512" fill="url(#a)" mask="url(#anahtar)"/>
</svg>
